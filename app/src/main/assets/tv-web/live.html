<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui">
    <meta name="referrer" content="origin">
    <title>xgplayer</title>
    <style type="text/css">
        html, body {width:100%;height:100%;margin:auto;overflow: hidden;background-color:#0a1f3a;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
        #mse {background-color:#0a1f3a;}
        /* 片库选集栏：央视网式 左下角按钮 + 底部展开面板 */
        #cctv-ep-btn{position:fixed;left:18px;bottom:18px;z-index:50;padding:9px 18px;background:rgba(10,31,58,.88);color:#e8c87a;border:1px solid #c0392b;border-radius:8px;font-size:18px;cursor:pointer;display:none;box-shadow:0 2px 8px rgba(0,0,0,.4);}
        #cctv-ep-btn:active{background:rgba(192,57,43,.85);color:#fff;}
        #cctv-ep-btn.focus{background:rgba(10,31,58,.95);color:#ffe9a8;border-color:#e8c87a;box-shadow:0 0 0 3px #e8c87a inset;transform:scale(1.06);}
        #cctv-ep-panel{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:48%;display:none;flex-direction:column;background:rgba(10,31,58,.96);border-top:2px solid #c0392b;box-shadow:0 -4px 16px rgba(0,0,0,.5);}
        #cctv-ep-title{padding:12px 18px;font-size:18px;color:#e8c87a;border-bottom:1px solid rgba(232,200,122,.25);display:flex;justify-content:space-between;align-items:center;gap:12px;}
        #cctv-ep-title .tip{font-size:14px;color:#9fb3c8;white-space:nowrap;}
        #cctv-ep-list{overflow-y:auto;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;}
        .cctv-ep{padding:8px 14px;min-width:96px;text-align:center;background:rgba(255,255,255,.06);color:#dbe6f0;border:1px solid rgba(255,255,255,.12);border-radius:6px;font-size:15px;cursor:pointer;user-select:none;}
        .cctv-ep.cur{background:rgba(192,57,43,.9);color:#fff;border-color:#e8c87a;}
        .cctv-ep.focus{border-color:#e8c87a;box-shadow:0 0 0 2px #e8c87a inset;color:#fff;}
        .cctv-ep:active{background:rgba(192,57,43,.7);color:#fff;}
    </style>
</head>
<body>
<div id="mse"></div>
<div id="cctv-ep-btn">选集</div>
<div id="cctv-ep-panel">
    <div id="cctv-ep-title"><span id="cctv-ep-name"></span><span class="tip">方向键切换 · OK选集 · 返回收起</span></div>
    <div id="cctv-ep-list"></div>
</div>
<link rel="stylesheet" href="js/xg/index.min.css"/>
<link href="css/rset.css?v=x" rel="stylesheet">
<script charset="utf-8" src="js/xg/2.31.2/index.min.js"></script>
<script charset="utf-8" src="js/xg/hls/2.2.2/index.min.js"></script>
<script charset="utf-8" src="js/xg/live.js"></script>
</body>
</html>
