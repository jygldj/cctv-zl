<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>观影之暇</title>
    <style>
        /* 老花友好色盘 */
        :root {
            --text: #e8e8e8; /* 象牙白 */
            --bg: #1a1a2a;   /* 深蓝黑 */
            --accent1: #ffaa00; /* 金橙 */
            --accent2: #00cc99; /* 薄荷绿 */
            --panel: rgba(200,200,200,0.15); /* 浅灰玻璃 */
        }
        
        body {
            margin: 0;
            background: var(--bg);
            font-family: 'Microsoft YaHei', sans-serif;
            color: var(--text);
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }      
        /* 太极容器（定位基准） */
        .taiji-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 20px auto;
        }
        
        /* 太极图 */
        .taiji {
            position: absolute;
            width: 120px;
            height: 120px;
            top: 30px;
            left: 30px;
            background: radial-gradient(circle at 50% 25%, #fff 25%, #000 25% 75%, #fff 75%);
            border-radius: 50%;
            animation: spin 8s infinite linear;
            box-shadow: 0 0 20px var(--accent1);
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); } /* 顺时针 */
        }
        
        .taiji::before, .taiji::after {
            content: "";
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .taiji::before {
            top: 25%;
            background: #000;
            box-shadow: 0 0 10px #fff;
        }
        
        .taiji::after {
            bottom: 25%;
            background: #fff;
            box-shadow: 0 0 10px #000;
        }
        
        /* 精准环绕文字 */
        .circle-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            animation: spin-reverse 16s infinite linear;
        }
        
        .circle-text span {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: var(--accent1);
            white-space: nowrap;
        }
        
        @keyframes spin-reverse {
            100% { transform: rotate(-360deg); } /* 逆时针 */
        }
        
        /* 火锅悟道 */
        .info-text {
    max-width: 500px; /* 保持最大宽度不变 */
    margin: 10px auto; /* 减小外边距，使整体更紧凑 */
    padding: 0 10px; /* 减小内边距，进一步压缩空间 */
    font-size: 0.9rem; /* 缩小字体大小 */
    line-height: 1.4; /* 缩小行间距 */
    position: relative;
    z-index: 1;
        }
        
        #donate-btn {
            background: linear-gradient(160deg, var(--accent1), var(--accent2));
            color: #222 !important;
            border: none;
            padding: 10px 20px /* 减少内边距 */
            font-size: 1rem; /* 减小字体大小 */
            border-radius: 50px;
            margin: 30px auto;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }
        
        #donate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255,170,0,0.5);
        }
        
        /* 重庆彩蛋 */
        .cq-egg {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 0.9rem;
            color: var(--accent1);
            writing-mode: vertical-rl;
        }
        
        /* 八卦漂浮特效 */
        .gua-float {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.2;
            animation: float 15s infinite linear;
            z-index: 1;
            text-shadow: 0 0 5px gold;
        }
        
        @keyframes float {
            0% { 
                transform: translate(0, 0) rotate(0deg);
                opacity: 0.1;
            }
            50% {
                opacity: 0.3;
                text-shadow: 0 0 10px orange;
            }
            100% { 
                transform: translate(100vw, -100vh) rotate(360deg);
                opacity: 0.1;
            }
        }
        
        /* 玫瑰特效 */
        .rose {
            position: absolute;
            font-size: 2rem;
            animation: float-up 1.5s ease-out forwards;
            z-index: 10;
        }
        
        @keyframes float-up {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1.5);
                opacity: 0;
            }
        }
        
        /* 分体式彩色文字 */
        .bless-text {
            position: absolute;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 10;
            animation: text-pop 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        
        .bless-text.left  {
            left: 20%;
            background: linear-gradient(45deg, #3399ff, #9966ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .bless-text.right  {
            right: 20%;
            background: linear-gradient(45deg, #ff3366, #ffcc00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        @keyframes text-pop {
            0% {
                transform: translateY(20px) scale(0.5);
                opacity: 0;
            }
            80% {
                transform: translateY(-5px) scale(1.1);
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- 太极容器 -->
    <div class="taiji-container">
        <div class="taiji"></div>
        <div class="circle-text"><span>来者有心 去者有意</span></div>
    </div>
    
    <div class="info-text">
        <p>观影之暇，不妨在此小憩片刻</p>
        <p>清风明月无价，片语拈花亦缘</p>
        <p>此间不留码迹，归去自有福田</p>
        <p>若怀慈心一片，门外"随喜"静候</p>
    </div>
    
    <button id="donate-btn">支持我</button>
    
    <div class="cq-egg">勒是雾都道玄</div>
    
    <script>
        // 八卦漂浮生成器 
        const guaList = ["䷀","䷁","䷂","䷃","䷄","䷅","䷆","䷇","䷈","䷉","䷊","䷋","䷌","䷍","䷎","䷏","䷐","䷑","䷒","䷓","䷔","䷕","䷖","䷗","䷘","䷙","䷚","䷛","䷜","䷝","䷞","䷟","䷠","䷡","䷢","䷣","䷤","䷥","䷦","䷧","䷨","䷩","䷪","䷫","䷬","䷭","䷮","䷯","䷰","䷱","䷲","䷳","䷴","䷵","䷶","䷷","䷸","䷹","䷺","䷻","䷼","䷽","䷾","䷿"];
        
        function createFloatingGua() {
            const gua = document.createElement("div");  
            gua.className  = "gua-float";
            gua.textContent  = guaList[Math.floor(Math.random()*64)];
            gua.style.left  = Math.random()*100  + 'vw';
            gua.style.top  = Math.random()*100  + 'vh';
            gua.style.animationDuration  = 10 + Math.random()*20  + 's';
            document.body.appendChild(gua);  
            
            setTimeout(() => gua.remove(),  parseFloat(gua.style.animationDuration)*1000);  
        }
        
        // 初始生成8个八卦 
        for(let i=0; i<8; i++) createFloatingGua();
        
        // 每隔3秒补充新八卦 
        setInterval(createFloatingGua, 3000);
        
        // 按钮点击效果 
        document.getElementById('donate-btn').addEventListener('click',  function(e) {
            // 禁止默认行为 
            e.preventDefault(); 
            
            // 按钮动画 
            this.style.background  = "linear-gradient(160deg, #ffcc00, #00aa77)";
            
            // 生成3朵玫瑰 
            for(let i=0; i<3; i++) {
                setTimeout(() => {
                    const rose = document.createElement("div"); 
                    rose.className  = "rose";
                    rose.innerHTML  = "🌹";
                    rose.style.left  = `${Math.random()  * 60 + 20}%`;
                    rose.style.top  = "60%";
                    rose.style.animationDelay  = `${i * 0.2}s`;
                    document.body.appendChild(rose); 
                    
                    setTimeout(() => rose.remove(),  1500);
                }, i * 200);
            }
            
            // 左右分体文字 
            const textLeft = document.createElement("div"); 
            textLeft.className  = "bless-text left";
            textLeft.textContent  = "予人玫瑰手留余香";
            textLeft.style.top  = "40%";
            document.body.appendChild(textLeft); 
            
            const textRight = document.createElement("div"); 
            textRight.className  = "bless-text right";
            textRight.textContent  = "自在禅意移步随喜";
            textRight.style.top  = "40%";
            document.body.appendChild(textRight); 
            
            // 3秒后移除文字 
            setTimeout(() => {
                textLeft.remove(); 
                textRight.remove(); 
            }, 3000);
        });
        
        // 自动放大字体（老年模式）
        document.body.style.fontSize  = "18px";
    </script>
</body>
</html>
